<rect x="30" y="300" width="1240" height="80" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="650.0" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#6d28d9" text-anchor="middle">One deployed path</text>
<text x="650.0" y="344.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">run_night_pipeline calls the stages in order: detect -&gt; CNN -&gt; link -&gt; features -&gt; classifier -&gt; cross-match -&gt; candidates.  The SAME function is used for evaluation (with planted</text>
<text x="650.0" y="362.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">fakes) and for the real search.</text>
<rect x="30" y="400" width="400" height="130" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="230.0" y="433.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">Reproducibility</text>
<text x="230.0" y="451.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">configs/*.yaml: every setting</text>
<text x="230.0" y="469.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">the night split, thresholds, sizes</text>
<text x="230.0" y="487.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">tests/: 150+ tests, all offline</text>
<text x="230.0" y="505.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">environment.yml: exact software</text>
<rect x="450" y="400" width="400" height="130" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="650.0" y="433.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">Model bundles (a mini registry)</text>
<text x="650.0" y="451.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">models/v1 ... v5: a version =</text>
<text x="650.0" y="469.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">CNN + tracklet model + thresholds</text>
<text x="650.0" y="487.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">+ the commit and nights used,</text>
<text x="650.0" y="505.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">never overwritten</text>
<rect x="870" y="400" width="400" height="130" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="1070.0" y="433.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#6d28d9" text-anchor="middle">Live viewer</text>
<text x="1070.0" y="451.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">scripts/live_viewer.py runs the</text>
<text x="1070.0" y="469.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">real functions one stage at a time</text>
<text x="1070.0" y="487.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">and shows the pictures in a browser</text>
<text x="1070.0" y="505.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">(src/asthunt/viewer/)</text>
<rect x="30" y="555" width="1240" height="150" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="650.0" y="598.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#6d28d9" text-anchor="middle">Engineering habits that make the results trustworthy</text>
<text x="650.0" y="616.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">1. All numbers in the README come from reports/scoreboard.csv, produced by ONE function (no notebook computes its own).</text>
<text x="650.0" y="634.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">2. The holdout night is opened in one place only, to write one number.</text>
<text x="650.0" y="652.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">3. A model is compared at the SAME false-alarm level, never at its own chosen threshold.</text>
<text x="650.0" y="670.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">4. Quick fixes were refused when a measurement pointed to a different cause (e.g. a linking bug, not a model problem).</text>
</svg>