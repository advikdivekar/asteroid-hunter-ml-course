<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520"><defs><marker id="head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="590.0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Advik: how deep can we see? (50%-completeness magnitude on the test night 2019-02-08)</text>
<text x="590" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">Larger magnitude = fainter. Completeness = fraction of planted fakes recovered.</text>
<text x="40" y="130" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">v1: single frames, first system</text>
<rect x="430" y="100" width="155.71875000000014" height="56" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="597.7187500000001" y="136" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#4b5563" text-anchor="start">20.51</text>
<text x="40" y="220" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">v4: relaxed linking + physics features</text>
<rect x="430" y="190" width="248.53125" height="56" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="690.53125" y="226" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="start">21.41</text>
<text x="40" y="310" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">deep search (shift-and-stack)</text>
<rect x="430" y="280" width="321.7500000000001" height="56" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="763.7500000000001" y="316" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="start">22.12</text>
<text x="430" y="82" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start">axis starts at magnitude 19</text>
<rect x="40" y="380" width="520" height="110" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="300.0" y="412.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">Lesson 1</text>
<text x="300.0" y="430.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">v1 -&gt; v4: found where asteroids were lost (linking), not by a bigger</text>
<text x="300.0" y="448.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">model.</text>
<text x="300.0" y="466.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">A multi-frame CNN TIED XGBoost: kept the simpler model.</text>
<rect x="600" y="380" width="540" height="110" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="870.0" y="421.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">Lesson 2</text>
<text x="870.0" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">v5 (3x more training data) did NOT help at equal false alarms.</text>
<text x="870.0" y="457.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">The limit is the photons in one 30 s frame, not the model.</text>
</svg>