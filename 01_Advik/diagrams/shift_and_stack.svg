<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520"><defs><marker id="head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="620.0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Advik: shift-and-stack, how we see what no single frame shows</text>
<text x="620" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">A faint asteroid is too weak in any one 30-second frame. If we shift the frames so the asteroid sits on the same spot and ADD them, it adds up; the noise does not.</text>
<rect x="40" y="90" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="54" cy="150" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="83" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">frame 1</text>
<rect x="140" y="90" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="162" cy="142" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="183" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">frame 2</text>
<rect x="240" y="90" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="270" cy="134" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="283" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">frame 3</text>
<rect x="340" y="90" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="378" cy="126" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="383" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">frame 4</text>
<rect x="440" y="90" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="486" cy="118" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="483" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">frame 5</text>
<rect x="540" y="90" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="594" cy="110" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="583" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">frame 6</text>
<rect x="640" y="90" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="702" cy="102" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="683" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">frame 7</text>
<rect x="740" y="90" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="810" cy="94" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="783" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">frame 8</text>
<line x1="430" y1="205" x2="430" y2="245" stroke="#6b7280" stroke-width="2" marker-end="url(#head)"/>
<text x="560.0" y="229.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">shift each frame by the trial motion</text>
<rect x="40" y="250" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="83" cy="293" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<rect x="140" y="250" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="183" cy="293" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<rect x="240" y="250" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="283" cy="293" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<rect x="340" y="250" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="383" cy="293" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<rect x="440" y="250" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="483" cy="293" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<rect x="540" y="250" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="583" cy="293" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<rect x="640" y="250" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="683" cy="293" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<rect x="740" y="250" width="86" height="86" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="783" cy="293" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<line x1="430" y1="345" x2="430" y2="385" stroke="#6b7280" stroke-width="2" marker-end="url(#head)"/>
<text x="490.0" y="369.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">add them up</text>
<rect x="250" y="390" width="360" height="100" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="430.0" y="426.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#6d28d9" text-anchor="middle">Result</text>
<text x="430.0" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">signal adds N times, noise only sqrt(N) times</text>
<text x="430.0" y="462.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">8 frames: gain 8 / 2.8 = 2.8x = +1.1 magnitudes</text>
<rect x="850" y="90" width="340" height="190" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="1020.0" y="120.66666666666667" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#6d28d9" text-anchor="middle">Search over motions</text>
<text x="1020.0" y="137.66666666666669" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">We do not know the motion, so we</text>
<text x="1020.0" y="154.66666666666669" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">TRY 4,888 trial motions</text>
<text x="1020.0" y="171.66666666666669" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">(every direction, up to 120 arcsec/hour)</text>
<text x="1020.0" y="188.66666666666669" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">on the GPU and keep the best</text>
<text x="1020.0" y="205.66666666666669" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle"></text>
<text x="1020.0" y="222.66666666666669" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Picking the best of 4,888 = the</text>
<text x="1020.0" y="239.66666666666669" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">LOOK-ELSEWHERE effect: noise alone</text>
<text x="1020.0" y="256.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">reaches 5 sigma, so the cut is 6 sigma</text>
<rect x="850" y="300" width="340" height="190" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="1020.0" y="339.1666666666667" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">Making it honest</text>
<text x="1020.0" y="356.1666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">real difference images are NOT Gaussian:</text>
<text x="1020.0" y="373.1666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">clip each frame at 5 sigma; remove the</text>
<text x="1020.0" y="390.1666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">night's median; standardise every pixel;</text>
<text x="1020.0" y="407.1666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">mask what single frames already see</text>
<text x="1020.0" y="424.1666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle"></text>
<text x="1020.0" y="441.1666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">peaks per stack: 47,550 -&gt; 94</text>
<text x="1020.0" y="458.1666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">null test (times shuffled): 0 false tracks</text>
</svg>