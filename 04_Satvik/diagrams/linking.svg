<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" width="1180" height="500"><defs><marker id="head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="590.0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Satvik: linking = a smart search, not learning</text>
<text x="590" y="62" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle">5 frames x ~8,000 blobs: trying every combination = about 2 x 10^19 tracks. Impossible. So: seed, predict, check.</text>
<rect x="60" y="90" width="120" height="250" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="120" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">frame 1</text>
<rect x="230" y="90" width="120" height="250" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="290" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">frame 2</text>
<rect x="400" y="90" width="120" height="250" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="460" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">frame 3</text>
<rect x="570" y="90" width="120" height="250" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="630" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">frame 4</text>
<rect x="740" y="90" width="120" height="250" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="800" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">frame 5</text>
<line x1="60" y1="322" x2="860" y2="124" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="120" cy="300" r="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<circle cx="290" cy="262" r="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<circle cx="460" cy="224" r="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<circle cx="630" cy="186" r="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<circle cx="800" cy="148" r="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<circle cx="90" cy="160" r="4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="150" cy="230" r="4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="260" cy="300" r="4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="320" cy="150" r="4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="430" cy="290" r="4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="490" cy="130" r="4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="600" cy="250" r="4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="660" cy="300" r="4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="770" cy="220" r="4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="830" cy="270" r="4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="140" cy="140" r="4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="300" cy="205" r="4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<rect x="900" y="90" width="250" height="250" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="1025.0" y="125.16666666666667" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">How</text>
<text x="1025.0" y="142.16666666666669" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">1. SEED: two blobs in two</text>
<text x="1025.0" y="159.16666666666669" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">frames at a plausible speed</text>
<text x="1025.0" y="176.16666666666669" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">(8-120 arcsec/hour)</text>
<text x="1025.0" y="193.16666666666669" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle"></text>
<text x="1025.0" y="210.16666666666669" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">2. PREDICT: that fixes a line,</text>
<text x="1025.0" y="227.16666666666669" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">so look UP where the object</text>
<text x="1025.0" y="244.16666666666669" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">must be in the other frames</text>
<text x="1025.0" y="261.1666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">(KD-tree, within 2 px)</text>
<text x="1025.0" y="278.1666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle"></text>
<text x="1025.0" y="295.1666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">3. KEEP: &gt;= 3 of 5 frames,</text>
<text x="1025.0" y="312.1666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">within 1.5 px of the line</text>
<rect x="40" y="370" width="540" height="110" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="310.0" y="394.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">Why it is fast</text>
<text x="310.0" y="411.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">the CNN removes ~76% of blobs first: seed pairs 52,000 -&gt; 3,500</text>
<text x="310.0" y="428.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">linking one night takes about 0.2 seconds</text>
<text x="310.0" y="445.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">minimum speed 8 arcsec/hour: slower 'movers' are just wobbling</text>
<text x="310.0" y="462.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">stationary artifacts</text>
<rect x="600" y="370" width="540" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="870.0" y="394.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">The biggest bug we found</text>
<text x="870.0" y="411.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">the telescope POINTING SHIFTS between exposures (up to 12 px).</text>
<text x="870.0" y="428.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Fix: put every blob on frame 1's sky grid (x_common, y_common)</text>
<text x="870.0" y="445.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">before linking. Real asteroids' straight-line error fell from</text>
<text x="870.0" y="462.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">~2.5 px to 0.05-0.47 px.</text>
</svg>