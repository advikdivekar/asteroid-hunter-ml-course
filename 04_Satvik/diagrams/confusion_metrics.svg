<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" width="1180" height="500"><defs><marker id="head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="590.0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Satvik: reading a confusion matrix (the logistic-regression baseline, validation nights)</text>
<rect x="60" y="110" width="200" height="70" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="160.0" y="149.33333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">called real</text>
<rect x="270" y="110" width="200" height="70" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="370.0" y="149.33333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">called bogus</text>
<text x="40" y="150" font-family="Helvetica, Arial, sans-serif" font-size="1" font-weight="normal" fill="#1f2937" text-anchor="middle"></text>
<rect x="60" y="190" width="200" height="90" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="160.0" y="229.66666666666666" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">1,547</text>
<text x="160.0" y="249.66666666666666" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">true positives</text>
<rect x="270" y="190" width="200" height="90" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="370.0" y="229.83333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">582</text>
<text x="370.0" y="248.83333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">false negatives (missed)</text>
<rect x="60" y="290" width="200" height="90" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="160.0" y="329.8333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">493</text>
<text x="160.0" y="348.8333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">false positives (alarms)</text>
<rect x="270" y="290" width="200" height="90" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="370.0" y="329.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">64,419</text>
<text x="370.0" y="349.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">true negatives</text>
<text x="40" y="235" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="end">truly real</text>
<text x="40" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="end">truly bogus</text>
<text x="520" y="130" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">recall = 1,547 / 2,129 = 72.7%</text>
<text x="520" y="155" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">(of all real objects, how many kept)</text>
<text x="520" y="180" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start"></text>
<text x="520" y="205" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">precision = 1,547 / 2,040 = 75.8%</text>
<text x="520" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">(of everything flagged, how many real)</text>
<text x="520" y="255" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start"></text>
<text x="520" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">false-positive rate = 493 / 64,912 = 0.76%</text>
<text x="520" y="305" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start"></text>
<text x="520" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">accuracy = (1,547 + 64,419) / 67,041 = 98.4%</text>
<rect x="60" y="410" width="1060" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="590.0" y="431.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">Why we do not report accuracy alone</text>
<text x="590.0" y="449.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Accuracy paradox: 'always say bogus' scores 96.8% accuracy and finds nothing (recall 0%). With rare positives, accuracy only measures the common class.</text>
<text x="590.0" y="467.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Use recall, precision and the precision-recall curve.</text>
</svg>