<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470"><defs><marker id="head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="590.0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Satvik: from one decision tree to gradient boosting (XGBoost)</text>
<rect x="40" y="70" width="320" height="150" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="200.0" y="95.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">Decision tree</text>
<text x="200.0" y="113.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">a single tree: a few yes/no</text>
<text x="200.0" y="131.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">questions, e.g. 'is the</text>
<text x="200.0" y="149.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">brightness steady?'</text>
<text x="200.0" y="167.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle"></text>
<text x="200.0" y="185.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">readable, but one tree</text>
<text x="200.0" y="203.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">over- or under-fits</text>
<rect x="430" y="70" width="320" height="150" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="590.0" y="104.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">Random forest (bagging)</text>
<text x="590.0" y="122.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">hundreds of trees, each on a</text>
<text x="590.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">random sample of rows and</text>
<text x="590.0" y="158.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">features; AVERAGE their votes</text>
<text x="590.0" y="176.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle"></text>
<text x="590.0" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">lower variance</text>
<rect x="820" y="70" width="320" height="150" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="980.0" y="95.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">Gradient boosting</text>
<text x="980.0" y="113.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">trees built ONE AFTER ANOTHER;</text>
<text x="980.0" y="131.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">each fits the ERRORS of the</text>
<text x="980.0" y="149.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">trees before it, scaled by a</text>
<text x="980.0" y="167.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">small learning rate</text>
<text x="980.0" y="185.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle"></text>
<text x="980.0" y="203.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">usually the best on tables</text>
<line x1="362" y1="145" x2="428" y2="145" stroke="#6b7280" stroke-width="2" marker-end="url(#head)"/>
<line x1="752" y1="145" x2="818" y2="145" stroke="#6b7280" stroke-width="2" marker-end="url(#head)"/>
<rect x="40" y="250" width="1100" height="90" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="590.0" y="290.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">Our model (train_tracklet_classifier.py)</text>
<text x="590.0" y="308.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">300 trees, depth 3, learning rate 0.05, each tree sees 80% of rows and 80% of columns.   Settings are modest on purpose: only ~1,600 tracklets to learn from.</text>
<rect x="40" y="360" width="1100" height="90" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="590.0" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">Honest result</text>
<text x="590.0" y="409.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">cross-validated by NIGHT (GroupKFold): logistic regression 0.999, tree 0.983, forest 0.999, XGBoost 0.999 (average precision).</text>
<text x="590.0" y="427.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">They TIE, so the choice is practical (handles missing values, interactions). A simpler model would also be defensible.</text>
</svg>