<text x="1000.0" y="138.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Input to the CNN</text>
<text x="1000.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">3 channels x 31 x 31 pixels</text>
<text x="1000.0" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle"></text>
<text x="1000.0" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">each channel normalised:</text>
<text x="1000.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">(value - median)</text>
<text x="1000.0" y="228.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">/ (1.4826 x MAD)</text>
<text x="1000.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">then clipped to [-10, 50]</text>
<text x="1000.0" y="264.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle"></text>
<text x="1000.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">so '5' means 5 sigma</text>
<text x="1000.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">on ANY night</text>
<text x="590" y="395" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">A person tells these apart by comparing the three panels. The CNN learns to do the same from examples.</text>
</svg>