<rect x="505" y="293" width="110" height="42" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="560.0" y="317.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">step / stripe</text>
