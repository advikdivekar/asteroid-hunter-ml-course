<text x="690" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">difference</text>
<text x="40" y="113" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#15803d" text-anchor="start">Real new object (asteroid)</text>
