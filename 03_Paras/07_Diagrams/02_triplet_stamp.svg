<text x="40" y="321" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="start">Edge of a masked area</text>
<rect x="375" y="293" width="110" height="42" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
