<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470"><defs><marker id="head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="590.0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Paras: where the labels come from (the sky is not labelled)</text>
<rect x="40" y="70" width="340" height="190" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="210.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1. Injection-recovery</text>
<text x="210.0" y="124.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">plant fake asteroids with known</text>
<text x="210.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">brightness, speed and direction,</text>
<text x="210.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">using ZTF's own blur shape (PSF)</text>
<text x="210.0" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">added to science AND difference</text>
<text x="210.0" y="196.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle"></text>
<text x="210.0" y="214.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">PERFECT labels; but only as real as the</text>
<text x="210.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">simulation</text>
<rect x="420" y="70" width="340" height="190" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="590.0" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">2. Known asteroids</text>
<text x="590.0" y="133.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">look up catalogued asteroids</text>
<text x="590.0" y="151.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">(JPL Horizons positions,</text>
<text x="590.0" y="169.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">SkyBoT as fallback)</text>
<text x="590.0" y="187.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">match to detections within 2 px</text>
<text x="590.0" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle"></text>
<text x="590.0" y="223.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">REAL labels; fewer; catalogues miss faint ones</text>
<rect x="800" y="70" width="340" height="190" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="970.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">3. Bogus = the rest</text>
<text x="970.0" y="124.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">everything not matched</text>
<text x="970.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle"></text>
<text x="970.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">includes variable stars, artifacts,</text>
<text x="970.0" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">and the rare real object nobody</text>
<text x="970.0" y="196.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">has catalogued yet</text>
<text x="970.0" y="214.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle"></text>
<text x="970.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">a little LABEL NOISE we accept</text>
<line x1="210" y1="262" x2="210" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#head)"/>
<line x1="590" y1="262" x2="590" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#head)"/>
<line x1="970" y1="262" x2="970" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#head)"/>
<rect x="40" y="300" width="1100" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="590.0" y="329.8333333333333" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Result</text>
<text x="590.0" y="348.8333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">one training night: 1,059 real vs 36,161 bogus   (1 : 34)   -&gt; a strongly imbalanced problem</text>
<rect x="40" y="385" width="1100" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="590.0" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">Quality checks</text>
<text x="590.0" y="433.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Checks: chance-match rate estimated (1.15% per point -&gt; 1.3 false matches per frame);  fakes vs real asteroids cannot be told apart (AUC 0.46-0.48)</text>
</svg>