<text x="590.0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Paras: cross-fitting, so the second model never sees over-confident scores</text>
<text x="590" y="62" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle">Problem: the tracklet model uses the CNN's scores as features. A CNN scoring its OWN training nights is over-confident.</text>
