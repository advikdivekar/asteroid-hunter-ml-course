<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker></defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="600.0" y="34" font-size="22" fill="#1a202c" text-anchor="middle" font-weight="bold">How the model is built and judged: injections, honest labels, one scoreboard</text>
<rect x="40" y="80" width="240" height="100" rx="9" fill="#e3f0fb" stroke="#2b6cb0" stroke-width="1.8"/>
<text x="160.0" y="116.0" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">Real ZTF nights</text>
<text x="160.0" y="134.0" font-size="12" fill="#3d4852" text-anchor="middle">train / validation / test</text>
<text x="160.0" y="152.0" font-size="12" fill="#3d4852" text-anchor="middle">split BY NIGHT and quadrant</text>
<rect x="330" y="80" width="240" height="100" rx="9" fill="#f1f3f5" stroke="#5c6770" stroke-width="1.8"/>
<text x="450.0" y="107.0" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">Plant fakes</text>
<text x="450.0" y="125.0" font-size="12" fill="#3d4852" text-anchor="middle">known magnitude, speed,</text>
<text x="450.0" y="143.0" font-size="12" fill="#3d4852" text-anchor="middle">angle; PSF-rendered</text>
<text x="450.0" y="161.0" font-size="12" fill="#3d4852" text-anchor="middle">(point and trailed)</text>
<rect x="620" y="80" width="240" height="100" rx="9" fill="#efe9fb" stroke="#6b46c1" stroke-width="1.8"/>
<text x="740.0" y="107.0" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">Labels</text>
<text x="740.0" y="125.0" font-size="12" fill="#3d4852" text-anchor="middle">fakes = truth</text>
<text x="740.0" y="143.0" font-size="12" fill="#3d4852" text-anchor="middle">real asteroids = Horizons</text>
<text x="740.0" y="161.0" font-size="12" fill="#3d4852" text-anchor="middle">positions (0.26 px)</text>
<rect x="910" y="80" width="250" height="100" rx="9" fill="#e6f6ea" stroke="#2f855a" stroke-width="1.8"/>
<text x="1035.0" y="107.0" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">Realism check</text>
<text x="1035.0" y="125.0" font-size="12" fill="#3d4852" text-anchor="middle">classifier can&#x27;t tell fakes</text>
<text x="1035.0" y="143.0" font-size="12" fill="#3d4852" text-anchor="middle">from real asteroids</text>
<text x="1035.0" y="161.0" font-size="12" fill="#3d4852" text-anchor="middle">(AUC 0.47 = indistinguishable)</text>
<line x1="280" y1="130" x2="330" y2="130" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="570" y1="130" x2="620" y2="130" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="860" y1="130" x2="910" y2="130" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="250" width="330" height="110" rx="9" fill="#e6f6ea" stroke="#2f855a" stroke-width="1.8"/>
<text x="205.0" y="291.0" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">Real/bogus CNN</text>
<text x="205.0" y="309.0" font-size="12" fill="#3d4852" text-anchor="middle">31x31 stamp triplet -&gt; logit</text>
<text x="205.0" y="327.0" font-size="12" fill="#3d4852" text-anchor="middle">cross-fitted scores for the next stage</text>
<rect x="430" y="250" width="330" height="110" rx="9" fill="#e6f6ea" stroke="#2f855a" stroke-width="1.8"/>
<text x="595.0" y="291.0" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">Tracklet classifier</text>
<text x="595.0" y="309.0" font-size="12" fill="#3d4852" text-anchor="middle">motion + brightness + CNN score</text>
<text x="595.0" y="327.0" font-size="12" fill="#3d4852" text-anchor="middle">+ path photometry features</text>
<rect x="820" y="250" width="340" height="110" rx="9" fill="#e6f6ea" stroke="#2f855a" stroke-width="1.8"/>
<text x="990.0" y="291.0" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">Multi-frame model (v5)</text>
<text x="990.0" y="309.0" font-size="12" fill="#3d4852" text-anchor="middle">all frames + stack -&gt; one score</text>
<text x="990.0" y="327.0" font-size="12" fill="#3d4852" text-anchor="middle">result: ties v4, simpler one kept</text>
<line x1="370" y1="305" x2="430" y2="305" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="760" y1="305" x2="820" y2="305" stroke="#4a5560" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
<polyline points="740,180 740,215 205,215 205,250" fill="none" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
<text x="470" y="208" font-size="11" fill="#4a5560" text-anchor="middle" font-style="italic">labelled detections / tracklets</text>
<rect x="40" y="430" width="330" height="120" rx="9" fill="#e6f6ea" stroke="#2f855a" stroke-width="1.8"/>
<text x="205.0" y="467.0" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">Model bundle (models/v4)</text>
<text x="205.0" y="485.0" font-size="12" fill="#3d4852" text-anchor="middle">CNN + classifier + thresholds,</text>
<text x="205.0" y="503.0" font-size="12" fill="#3d4852" text-anchor="middle">frozen together: one version is</text>
<text x="205.0" y="521.0" font-size="12" fill="#3d4852" text-anchor="middle">one directory</text>
<line x1="205" y1="360" x2="205" y2="430" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
<polyline points="595,360 595,395 300,395 300,430" fill="none" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="430" y="410" width="730" height="200" rx="14" fill="none" stroke="#a0aab4" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="444" y="430" font-size="13" fill="#5c6770" text-anchor="start" font-weight="bold">Scoreboard (evaluate/build_scoreboard.py): every number from saved files</text>
<rect x="450" y="450" width="215" height="130" rx="9" fill="#fff3d6" stroke="#b7791f" stroke-width="1.8"/>
<text x="557.5" y="501.0" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">Completeness</text>
<text x="557.5" y="519.0" font-size="12" fill="#3d4852" text-anchor="middle">50% at mag 21.4 (single)</text>
<text x="557.5" y="537.0" font-size="12" fill="#3d4852" text-anchor="middle">22.1 (deep search)</text>
<rect x="685" y="450" width="215" height="130" rx="9" fill="#fff3d6" stroke="#b7791f" stroke-width="1.8"/>
<text x="792.5" y="492.0" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">False alarms</text>
<text x="792.5" y="510.0" font-size="12" fill="#3d4852" text-anchor="middle">bogus candidates</text>
<text x="792.5" y="528.0" font-size="12" fill="#3d4852" text-anchor="middle">per night, equal-alarm</text>
<text x="792.5" y="546.0" font-size="12" fill="#3d4852" text-anchor="middle">comparison</text>
<rect x="920" y="450" width="220" height="130" rx="9" fill="#fff3d6" stroke="#b7791f" stroke-width="1.8"/>
<text x="1030.0" y="492.0" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">Known recovery</text>
<text x="1030.0" y="510.0" font-size="12" fill="#3d4852" text-anchor="middle">asteroids by magnitude;</text>
<text x="1030.0" y="528.0" font-size="12" fill="#3d4852" text-anchor="middle">never-opened holdout</text>
<text x="1030.0" y="546.0" font-size="12" fill="#3d4852" text-anchor="middle">night 2022-06-17</text>
<line x1="370" y1="490" x2="450" y2="510" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="660" width="1120" height="70" rx="9" fill="#fde8e8" stroke="#c53030" stroke-width="1.8"/>
<text x="600.0" y="690.0" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">The rule</text>
<text x="600.0" y="708.0" font-size="12" fill="#3d4852" text-anchor="middle">A change ships only if it beats the previous version on this same scoreboard at an equal false-alarm rate, on data nobody tuned on.</text>
</svg>