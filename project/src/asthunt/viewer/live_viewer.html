<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asteroid hunter live view</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #121927; --panel-2: #172033; --line: #26324a; --text: #d9e1ee; --muted: #8392ab;
    --teal: #5eead4; --amber: #fbbf24; --pink: #f472b6; --blue: #60a5fa; --red: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  h1 small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-left: auto; }
  select, input[type=number], button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; }
  input[type=number] { width: 64px; }
  button { cursor: pointer; font-weight: 600; }
  button.primary { background: var(--teal); color: #052e2b; border-color: var(--teal); }
  button:disabled { opacity: .4; cursor: default; }
  label.check { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
  .chip { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; border: 1px solid var(--line); color: var(--muted); }
  .chip.running { color: var(--teal); border-color: var(--teal); }
  .chip.paused { color: var(--amber); border-color: var(--amber); }
  .chip.finished { color: var(--blue); border-color: var(--blue); }
  .chip.error, .chip.cancelled { color: var(--red); border-color: var(--red); }
  main { display: grid; grid-template-columns: 290px 1fr; gap: 0; min-height: calc(100vh - 70px); }
  nav { border-right: 1px solid var(--line); padding: 14px 10px; background: var(--panel); }
  nav button.stage { display: flex; width: 100%; text-align: left; gap: 10px; align-items: flex-start; background: transparent; border: 1px solid transparent; font-weight: 500; padding: 8px 10px; margin-bottom: 2px; border-radius: 8px; color: var(--muted); }
  nav button.stage.selected { background: var(--panel-2); border-color: var(--line); color: var(--text); }
  nav button.stage .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; border: 2px solid var(--line); }
  nav button.stage.running .dot { border-color: var(--teal); background: var(--teal); animation: pulse 1.1s infinite; }
  nav button.stage.done .dot { border-color: var(--teal); background: var(--teal); }
  nav button.stage.skipped .dot { border-color: var(--muted); background: var(--muted); opacity: .5; }
  nav button.stage.error .dot { border-color: var(--red); background: var(--red); }
  nav button.stage .sec { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(94,234,212,.6); } 50% { box-shadow: 0 0 0 6px rgba(94,234,212,0); } }
  section#view { padding: 22px 26px 60px; max-width: 1180px; }
  .agent { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--teal); border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; }
  .agent .who { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--teal); font-weight: 700; margin-bottom: 4px; }
  .now { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); color: var(--amber); font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  h2 { font-size: 20px; margin: 0 0 12px; }
  .terms { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; }
  .terms .who { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--amber); font-weight: 700; margin-bottom: 6px; }
  .terms dt { font-weight: 650; margin-top: 6px; }
  .terms dd { margin: 0 0 0 0; color: var(--muted); }
  .numbers { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .num { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .num .k { color: var(--muted); font-size: 12px; }
  .num .v { font-size: 17px; font-weight: 650; word-break: break-word; }
  figure { margin: 0 0 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  figure img { max-width: 100%; height: auto; display: block; margin: 0 auto; border-radius: 6px; cursor: zoom-in; }
  figcaption { color: var(--muted); font-size: 13px; margin-top: 8px; }
  table { border-collapse: collapse; width: 100%; max-width: 780px; margin-bottom: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; background: var(--panel-2); }
  .notes { color: var(--muted); font-size: 13px; font-family: ui-monospace, Menlo, monospace; margin-bottom: 18px; }
  .skipped { color: var(--muted); border: 1px dashed var(--line); padding: 12px 14px; border-radius: 10px; margin-bottom: 18px; }
  .empty { color: var(--muted); padding: 60px 0; text-align: center; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 6px 20px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; z-index: 20; cursor: zoom-out; }
  #zoom img { max-width: 96vw; max-height: 96vh; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } nav { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Asteroid hunter, live view<small>the real pipeline, one stage at a time</small></h1>
  <div class="controls">
    <select id="unit" title="Night to process"></select>
    <label class="check" title="Paint fake asteroids into the images so you can watch them being found">fakes <input id="fakes" type="number" min="0" max="40" value="8"></label>
    <label class="check"><input id="step" type="checkbox" checked> step by step</label>
    <button id="start" class="primary">Start</button>
    <button id="next" disabled>Next stage</button>
    <button id="stop" disabled>Stop</button>
    <span id="status" class="chip">idle</span>
  </div>
</header>
<main>
  <nav id="nav"></nav>
  <section id="view"><div class="empty">Choose a night and press Start. Each stage appears here as the pipeline finishes it.</div></section>
</main>
<footer><span id="message">&nbsp;</span><span id="elapsed"></span></footer>
<div id="zoom"><img alt=""></div>
<script>
let selected = null, follow = true, last = null, lastSignature = "";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, body) {
  const options = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  return (await fetch(path, options)).json();
}

async function loadUnits() {
  const units = await api("/api/units");
  $("unit").innerHTML = units.length ? units.map(u => `<option value="${esc(u.tag)}">${esc(u.label)}</option>`).join("") : "<option>no nights on disk</option>";
}

$("start").onclick = async () => {
  follow = true; selected = null; lastSignature = "";
  const reply = await api("/api/start", {unit: $("unit").value, fakes: +$("fakes").value, step_mode: $("step").checked});
  if (reply.error) alert(reply.error);
};
$("next").onclick = () => api("/api/next", {});
$("stop").onclick = () => api("/api/stop", {});
$("step").onchange = () => api("/api/mode", {step_mode: $("step").checked});
$("zoom").onclick = () => { $("zoom").style.display = "none"; };

function signature(state) {
  return state.status + "|" + state.stages.map(s => [s.status, s.numbers.length, s.images.length, s.notes.length, s.table ? 1 : 0, s.skipped ? 1 : 0].join(",")).join(";") + "|" + selected;
}

function renderNav(state) {
  $("nav").innerHTML = state.stages.map(s =>
    `<button class="stage ${s.status} ${s.id === selected ? "selected" : ""}" data-id="${s.id}"><span class="dot"></span><span>${esc(s.title)}</span><span class="sec">${s.seconds == null ? "" : s.seconds + " s"}</span></button>`).join("");
  document.querySelectorAll("nav .stage").forEach(b => b.onclick = () => { selected = b.dataset.id; follow = false; last && render(last, true); });
}

function renderStage(stage) {
  const latest = stage.notes.length ? stage.notes[stage.notes.length - 1] : "";
  let html = `<h2>${esc(stage.title)}</h2><div class="agent"><div class="who">In simple words</div>${esc(stage.narration)}`;
  if (stage.status === "running") html += `<div class="now">working... ${esc(latest)}</div>`;
  html += `</div>`;
  if (stage.terms && stage.terms.length) html += `<div class="terms"><div class="who">Words used on this step</div><dl>${stage.terms.map(([w, m]) => `<dt>${esc(w)}</dt><dd>${esc(m)}</dd>`).join("")}</dl></div>`;
  if (stage.skipped) html += `<div class="skipped">Skipped: ${esc(stage.skipped)}</div>`;
  if (stage.numbers.length) html += `<div class="numbers">${stage.numbers.map(([k, v]) => `<div class="num"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("")}</div>`;
  html += stage.images.map(i => `<figure><img src="${i.url}" alt="${esc(i.label)}"><figcaption>${esc(i.label)}</figcaption></figure>`).join("");
  if (stage.table) html += `<table><thead><tr>${stage.table.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${stage.table.rows.map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  if (stage.notes.length && stage.status !== "running") html += `<div class="notes">${stage.notes.map(esc).join("<br>")}</div>`;
  if (stage.status === "waiting") html += `<div class="empty">Not reached yet.</div>`;
  return html;
}

function render(state, force) {
  last = state;
  const current = state.stages.find(s => s.status === "running") || [...state.stages].reverse().find(s => s.status !== "waiting");
  if (follow && current) selected = current.id;
  const sig = signature(state);
  if (!force && sig === lastSignature) { $("elapsed").textContent = state.unit ? state.elapsed + " s" : ""; return; }
  lastSignature = sig;
  const status = $("status");
  status.textContent = state.status; status.className = "chip " + state.status;
  $("message").textContent = state.message || (state.unit ? `${state.unit.label}` : "");
  $("elapsed").textContent = state.unit ? state.elapsed + " s" : "";
  const active = state.status === "running" || state.status === "paused";
  if (state.unit && [...$("unit").options].some(o => o.value === state.unit.tag) && document.activeElement !== $("unit")) $("unit").value = state.unit.tag;
  $("start").disabled = active; $("stop").disabled = !active; $("next").disabled = state.status !== "paused";
  renderNav(state);
  const stage = state.stages.find(s => s.id === selected);
  if (stage) {
    const scroll = window.scrollY;
    $("view").innerHTML = renderStage(stage);
    document.querySelectorAll("figure img").forEach(img => img.onclick = () => { $("zoom").querySelector("img").src = img.src; $("zoom").style.display = "flex"; });
    window.scrollTo(0, scroll);
  }
}

async function poll() {
  try { render(await api("/api/state")); } catch (e) { $("message").textContent = "waiting for the server..."; }
  setTimeout(poll, 800);
}
loadUnits().then(poll);
</script>
</body>
</html>
