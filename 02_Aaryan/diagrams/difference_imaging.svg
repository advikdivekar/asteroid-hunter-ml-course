<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 470" width="1140" height="470"><defs><marker id="head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="570.0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Aaryan: difference imaging, why only new things remain</text>
<rect x="40" y="70" width="250" height="130" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
<text x="165.0" y="120.33333333333333" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f766e" text-anchor="middle">SCIENCE</text>
<text x="165.0" y="139.33333333333331" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">tonight's picture</text>
<text x="165.0" y="158.33333333333331" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">(stars + sky + asteroid)</text>
<text x="318" y="142" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1f2937" text-anchor="middle">-</text>
<rect x="345" y="70" width="250" height="130" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="470.0" y="110.83333333333333" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">REFERENCE</text>
<text x="470.0" y="129.83333333333331" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">the same sky long ago</text>
<text x="470.0" y="148.83333333333331" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">(stars + sky, no asteroid)</text>
<text x="470.0" y="167.83333333333331" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">blurred to match tonight</text>
<text x="623" y="142" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1f2937" text-anchor="middle">=</text>
<rect x="650" y="70" width="250" height="130" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="775.0" y="120.33333333333333" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">DIFFERENCE</text>
<text x="775.0" y="139.33333333333331" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">stars and sky cancel</text>
<text x="775.0" y="158.33333333333331" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">what is left is NEW</text>
<line x1="900" y1="135" x2="940" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#head)"/>
<rect x="940" y="70" width="170" height="130" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="1025.0" y="129.83333333333334" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">Detect</text>
<text x="1025.0" y="148.83333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">blobs to examine</text>
<rect x="40" y="240" width="1070" height="190" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="575.0" y="266" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">What a difference image contains</text>
<text x="70" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#15803d" text-anchor="start">new or moving thing</text>
<text x="420" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">star-shaped POSITIVE blob (what we want)</text>
<text x="70" y="326" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#4b5563" text-anchor="start">faded or departed thing</text>
<text x="420" y="326" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">NEGATIVE blob (we ignore these)</text>
<text x="70" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="start">bright star, imperfect subtraction</text>
<text x="420" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">dipole: a bright half and a dark half side by side</text>
<text x="70" y="378" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="start">cosmic ray</text>
<text x="420" y="378" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">sharp spike, narrower than a star</text>
<text x="70" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="start">pure noise</text>
<text x="420" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">random speckle; 2-sigma blips pass the threshold by chance</text>
</svg>