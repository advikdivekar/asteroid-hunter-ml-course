<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470"><defs><marker id="head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="550.0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Aaryan: how many 'things' are left at each step (one training frame)</text>
<rect x="40" y="65" width="880" height="52" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
<text x="60" y="98" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4b5563" text-anchor="start">1,950</text>
<text x="170" y="97" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">sources in the SCIENCE image</text>
<rect x="40" y="135" width="520" height="52" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
<text x="60" y="168" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f766e" text-anchor="start">334</text>
<text x="170" y="167" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">sources in the DIFFERENCE image at 5-sigma</text>
<rect x="40" y="205" width="880" height="52" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="60" y="238" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1d4ed8" text-anchor="start">7,764</text>
<text x="170" y="237" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">blobs at 2-sigma (lenient on purpose: do not miss anything)</text>
<rect x="40" y="275" width="420" height="52" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="60" y="308" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1d4ed8" text-anchor="start">173</text>
<text x="170" y="307" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">of those have SNR &gt; 5</text>
<rect x="40" y="345" width="880" height="52" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="60" y="378" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#b45309" text-anchor="start">~1,000</text>
<text x="170" y="377" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">real detections per night (planted fakes + known asteroids) among ~36,000 blobs</text>
<text x="550" y="440" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">Detection is tuned for COMPLETENESS (miss nothing). Classification, next, is tuned for PURITY (throw junk away).</text>
</svg>